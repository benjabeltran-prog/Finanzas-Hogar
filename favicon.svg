<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3568e0"/>
      <stop offset="100%" stop-color="#6d4fd6"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="100" height="100" rx="24" fill="url(#bg)"/>

  <!-- Sutil brillo superior, para look "premium" -->
  <rect width="100" height="50" rx="24" fill="#ffffff" opacity="0.06"/>

  <!-- Casa (techo + cuerpo) -->
  <path d="M50 20 L76 42 V76 A4 4 0 0 1 72 80 H28 A4 4 0 0 1 24 76 V42 Z"
        fill="none" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Barras de crecimiento financiero, dentro de la casa -->
  <rect x="34" y="62" width="7" height="12" rx="2" fill="url(#bar)"/>
  <rect x="46.5" y="54" width="7" height="20" rx="2" fill="url(#bar)"/>
  <rect x="59" y="46" width="7" height="28" rx="2" fill="#ffffff"/>
</svg>
